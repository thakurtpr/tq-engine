[package]
name = "tq-mm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline market-making research on tq-l2rec recordings: book rebuild, Gate 1 integrity checks, fill simulation."

[[bin]]
name = "tq-mm-gate1"
path = "src/bin/gate1.rs"

[[bin]]
name = "tq-mm-sim"
path = "src/bin/sim.rs"

[dependencies]
serde_json = "1"
flate2 = "1.1"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4.38", default-features = false, features = ["std"] }
